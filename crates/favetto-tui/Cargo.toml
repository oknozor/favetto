[package]
name = "favetto-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal client for the favetto agent orchestrator."

[lib]
name = "favetto_tui"
path = "src/lib.rs"

[[bin]]
name = "favetto-tui"
path = "src/main.rs"

[dependencies]
favetto-core = { path = "../favetto-core" }
favetto-providers = { path = "../favetto-providers" }

anyhow = "1"
ascii-dag = "0.11"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http = "1"
libc = "0.2"
parking_lot = "0.12"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
throbber-widgets-tui = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.16"
