[package]
name = "favetto-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared wire protocol, domain types, and configuration for favetto."

[dependencies]
favetto-wire = { path = "../favetto-wire", features = ["schema"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
config = "0.15"
dirs = "7"
rmp-serde = "1.3"
schemars = { version = "1", features = ["derive", "chrono04", "uuid1"] }
toml = "1.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
subtle = "2"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
proptest = { workspace = true }
