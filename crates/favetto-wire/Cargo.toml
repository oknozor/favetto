[package]
name = "favetto-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-free shared serde/MessagePack wire and domain types for favetto."

[features]
default = []
# Enabled by favetto-core for the native docgen build.
schema = ["dep:schemars"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
url = "2"
schemars = { version = "1", features = ["derive", "uuid1"], optional = true }

[dev-dependencies]
rmp-serde = "1.3"

# wasm32-unknown-unknown needs a randomness source for `Uuid::new_v4()` and the
# JS clock for `OffsetDateTime::now_utc()`; these features are additive on top
# of the normal deps.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }
time = { workspace = true, features = ["wasm-bindgen"] }
