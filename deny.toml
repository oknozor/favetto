# cargo-deny configuration — run with `cargo deny check` (installed via
# `cargo install cargo-deny --locked`, or the CI job in .github/workflows/ci.yml).
#
# Policy: allow only permissive licenses, deny known vulnerabilities, and keep
# the crate graph on crates.io. Run the whole workspace through this before
# pushing whenever `Cargo.lock` changes.

[advisories]
# Vulnerabilities are denied by default. Add ignores here with a reason when a
# transitive advisory is accepted (and prefer upgrading instead).
ignore = []

[licenses]
# Permissive licenses only. `LGPL-2.1-or-later` (r-efi) is intentionally absent:
# r-efi is dual/multi-licensed and resolves through MIT/Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are common in a large tree; surface them without failing.
multiple-versions = "warn"
# Warn (not deny) so unpublished intra-workspace `path` dependencies don't trip
# the check; a real `*` registry requirement should be fixed, not ignored.
wildcards = "warn"

[sources]
# Everything must come from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
