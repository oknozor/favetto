version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]

  # The Dioxus client is a standalone workspace (`web/`), so it needs its own
  # entry to keep `web/Cargo.lock` scanned and bumped.
  - package-ecosystem: cargo
    directory: "/web"
    schedule:
      interval: weekly
    groups:
      cargo-web:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
