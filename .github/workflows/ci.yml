name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the declared MSRV toolchain
        uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Check against the declared MSRV
        run: cargo check --locked --workspace --all-targets

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with the wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check favetto-wire against wasm32-unknown-unknown
        run: cargo check --locked -p favetto-wire --target wasm32-unknown-unknown

  test:
    name: nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run --locked --workspace

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate the reference
        run: cargo run --locked -p favetto -- __doc
      - name: Fail when the committed reference is stale
        run: git diff --exit-code -- docs/reference docs/public/favetto-schema.json
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - name: Build the site (checks internal links)
        run: npm run docs:check
        working-directory: docs

  conventional-commits:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The `web/` Dioxus client is a standalone workspace (see the root `exclude`);
  # these jobs own its toolchain. `dx` is pinned to the version the client is
  # locked against, and wasm-bindgen is resolved by `dx` from `web/Cargo.lock`.
  web:
    name: web (wasm)
    runs-on: ubuntu-latest
    env:
      # Keep in lockstep with `dioxus` in `web/Cargo.toml`.
      DX_VERSION: 0.7.10
      # Gzipped WASM budget, in bytes: warn over 500 KB, fail over 1 MB.
      WEB_WARN_BYTES: "500000"
      WEB_FAIL_BYTES: "1000000"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with rustfmt and the wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      - name: Cache the pinned Dioxus CLI
        id: dx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: dx-${{ env.DX_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned Dioxus CLI
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version "$DX_VERSION" --locked
      - name: Cache the Dioxus toolchain downloads
        uses: actions/cache@v4
        with:
          path: ~/.local/share/.dx
          key: dx-tools-${{ runner.os }}-${{ env.DX_VERSION }}
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: web
      - name: Run the client unit tests
        run: cargo test --locked
        working-directory: web
      - name: Build the web bundle
        run: dx bundle --locked --release --platform web
        working-directory: web
      - name: Check the committed Tailwind CSS is current
        # `dx bundle` regenerates `assets/tailwind.css` from `tailwind.css`; a
        # diff means the committed artifact drifted and must be regenerated.
        run: git diff --exit-code -- assets/tailwind.css
        working-directory: web
      - name: Stage the bundle for the daemon's rust-embed
        # Dioxus 0.7 emits the web bundle under `dist/public`; the daemon embeds
        # `web/dist`, so flatten it there (the committed `index.html` is only the
        # no-assets placeholder).
        run: |
          set -euo pipefail
          rm -rf dist/assets
          cp -R dist/public/. dist/
          rm -rf dist/public
        working-directory: web
      - name: Check the gzipped WASM budget
        run: |
          set -euo pipefail
          wasm=$(find dist/assets -name '*.wasm' -print -quit)
          if [ -z "$wasm" ]; then
            echo "::error::no hashed .wasm asset found under web/dist/assets"
            exit 1
          fi
          bytes=$(gzip -c "$wasm" | wc -c | tr -d ' ')
          kib=$((bytes / 1024))
          echo "gzipped WASM: $kib KiB ($bytes bytes) — $(basename "$wasm")"
          if [ "$bytes" -gt "$WEB_FAIL_BYTES" ]; then
            echo "::error::gzipped WASM is over the 1 MB budget ($kib KiB)"
            exit 1
          fi
          if [ "$bytes" -gt "$WEB_WARN_BYTES" ]; then
            echo "::warning::gzipped WASM is over the 500 KB budget ($kib KiB)"
          fi
        working-directory: web
      - name: Upload the staged web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  android:
    name: android (apk)
    runs-on: ubuntu-latest
    env:
      DX_VERSION: 0.7.10
      ANDROID_TARGET: aarch64-linux-android
      ANDROID_PLATFORM: "34"
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_PLATFORM }}.0.0
            ndk;${{ env.NDK_VERSION }}
      - name: Export the Android toolchain paths
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          ndk="$sdk/ndk/$NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          fi
          {
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_NDK_HOME=$ndk"
            echo "NDK_HOME=$ndk"
          } >> "$GITHUB_ENV"
      - name: Install Rust with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      - name: Cache the pinned Dioxus CLI
        id: dx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: dx-${{ env.DX_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned Dioxus CLI
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version "$DX_VERSION" --locked
      - name: Cache the Dioxus toolchain downloads
        uses: actions/cache@v4
        with:
          path: ~/.local/share/.dx
          key: dx-tools-${{ runner.os }}-${{ env.DX_VERSION }}
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ env.DX_VERSION }}-${{ hashFiles('web/Cargo.lock') }}
      - name: Configure Android release signing
        working-directory: web
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # `dx` only runs Gradle's `assembleRelease` when `[bundle.android]` is
        # set; without it the APK is a ~200 MB debug build. Prefer the keystore
        # from repository secrets, and fall back to an ephemeral one so the
        # artifact is a real release build even on forks / before the secrets
        # exist.
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "Using the release keystore from repository secrets."
            printf '%s' "$KEYSTORE_B64" | base64 -d > android-release.jks
            store_pass="$KEYSTORE_PASSWORD"
            key_pass="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            key_alias="${KEY_ALIAS:-favetto}"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret; generating an ephemeral CI keystore."
            store_pass="ci-password"
            key_pass="ci-password"
            key_alias="favetto"
            keytool -genkeypair -v -keystore android-release.jks -alias "$key_alias" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$store_pass" -keypass "$key_pass" \
              -dname "CN=favetto CI"
          fi
          # Defensive: drop any active `[bundle.android]` table so re-committing
          # the template can never collide with the table appended below.
          awk '
            /^\[bundle\.android\]$/ { skip = 1; next }
            /^\[/ { skip = 0 }
            !skip
          ' Dioxus.toml > Dioxus.toml.ci
          mv Dioxus.toml.ci Dioxus.toml
          cat >> Dioxus.toml <<EOF

          [bundle.android]
          jks_file = "android-release.jks"
          jks_password = "$store_pass"
          key_alias = "$key_alias"
          key_password = "$key_pass"
          EOF
      - name: Bundle the release APK
        # Go through the wrapper so the favetto launcher-icon Gradle init script
        # is installed; `dx` 0.7.10 otherwise ships the stock Android icon.
        run: >-
          ./android/dx.sh bundle --locked --release --platform android
          --package-types apk --features mobile --target "$ANDROID_TARGET"
        working-directory: web
      - name: Check the APK size
        # A debug APK keeps the Rust symbols and weighs ~200 MiB; a release one
        # is ~15-30 MiB. This guards against silently reverting to `assembleDebug`.
        working-directory: web
        run: |
          set -euo pipefail
          apk=$(find dist -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::no APK produced under web/dist"
            exit 1
          fi
          bytes=$(stat -c%s "$apk")
          echo "APK: $apk ($((bytes / 1024 / 1024)) MiB)"
          if [ "$bytes" -gt 62914560 ]; then
            echo "::error::APK is $((bytes / 1024 / 1024)) MiB (> 60 MiB) — probably a debug build; check --release and [bundle.android]"
            exit 1
          fi
      - name: Check the launcher icon came from web/android/res
        # `dx`'s stock foreground is `drawable/ic_launcher_foreground`; the
        # overlay moves it to `mipmap/ic_launcher_foreground`, so its presence in
        # the packaged resource table proves the init script ran.
        working-directory: web
        run: |
          set -euo pipefail
          apk=$(find dist -name '*.apk' -print -quit)
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          aapt2="$sdk/build-tools/${ANDROID_PLATFORM}.0.0/aapt2"
          if [ ! -x "$aapt2" ]; then
            aapt2="$(find "$sdk/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -n1)"
          fi
          if [ -z "$aapt2" ]; then
            echo "::warning::aapt2 not found; skipping the launcher-icon resource check"
            exit 0
          fi
          resources="$("$aapt2" dump resources "$apk")"
          grep -q 'mipmap/ic_launcher_foreground' <<<"$resources"
          echo "APK carries the favetto mipmap launcher foreground."
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: favetto-android-apk
          path: web/dist/*.apk
          if-no-files-found: error
