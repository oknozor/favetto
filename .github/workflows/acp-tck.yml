name: ACP TCK

# Runs the official Agent Client Protocol Test Compatibility Kit
# (https://github.com/agentclientprotocol/acp-tck) against the repo's only
# ACP agent-role implementation: the `fake-acp-agent` test fixture
# (crates/favetto/tests/fixtures/fake_acp_agent.rs). Favetto itself is the ACP
# *client* role, which the TCK cannot drive (it launches agents as stdio
# subprocesses), so the fixture is what gets scored.
#
# The TCK is pinned to a release tag for reproducibility; bump ACP_TCK_REF
# deliberately. The v1 suite gates pull requests: the fixture must stay
# conformant. The v2 run stays informational because the fixture negotiates
# protocolVersion 1, so it is blocked by a version mismatch by design. JSON
# reports and console logs are always uploaded as artifacts.
#
# A second job, `interop`, covers Favetto's *client* role against a real,
# independently TCK-conformant agent: the pinned ACP Python SDK's
# `examples/echo_agent.py`, driven through `acp_interop_e2e.rs`. The client
# role is additionally pinned by wire-contract e2e tests
# (`acp_client_contract_e2e.rs`) in the main CI `nextest` job.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/acp-tck.yml
      - crates/favetto/Cargo.toml
      - crates/favetto/tests/**
      - Cargo.lock
  pull_request:
    paths:
      - .github/workflows/acp-tck.yml
      - crates/favetto/Cargo.toml
      - crates/favetto/tests/**
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ACP_TCK_REF: v0.5.0
  # Pinned ACP Python SDK revision (the `1.0.0` tag); echo_agent.py is taken
  # from this checkout, like acp-tck's own cross-check pins.
  ACP_PYTHON_SDK_SHA: 9853d8b514d6340000bcbd01ec07808436db80cf

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acp-tck:
    name: acp-tck v1 (fake-acp-agent)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the fake ACP agent fixture
        run: cargo build --locked -p favetto --bin fake-acp-agent
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv
      - name: Prepare the agent working directory
        run: mkdir -p "$RUNNER_TEMP/acp-tck-wd"
      - name: Run ACP TCK v1 against fake-acp-agent
        run: |
          uvx --from "git+https://github.com/agentclientprotocol/acp-tck@${{ env.ACP_TCK_REF }}" acp-tck \
            --agent-cwd "$RUNNER_TEMP/acp-tck-wd" \
            --timeout 30 --test-timeout 120 \
            --report-json "$RUNNER_TEMP/acp-tck-report-v1.json" \
            -- "$PWD/target/debug/fake-acp-agent" 2>&1 | tee "$RUNNER_TEMP/acp-tck-v1.log"
      - name: Run ACP TCK v2 against fake-acp-agent (informational only)
        # The fixture negotiates protocolVersion 1, so the v2 run is blocked by
        # version mismatch by design and must not fail the job.
        continue-on-error: true
        run: |
          uvx --from "git+https://github.com/agentclientprotocol/acp-tck@${{ env.ACP_TCK_REF }}" acp-tck \
            --protocol-version 2 \
            --agent-cwd "$RUNNER_TEMP/acp-tck-wd" \
            --timeout 30 --test-timeout 120 \
            --report-json "$RUNNER_TEMP/acp-tck-report-v2.json" \
            -- "$PWD/target/debug/fake-acp-agent" 2>&1 | tee "$RUNNER_TEMP/acp-tck-v2.log"
      - name: Upload TCK reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acp-tck-reports
          path: ${{ env.RUNNER_TEMP }}/acp-tck-*.{json,log}
          retention-days: 30
          overwrite: true

  interop:
    name: interop (python-sdk echo_agent)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv
      - name: Fetch the pinned ACP Python SDK
        run: |
          git clone --depth 1 https://github.com/agentclientprotocol/python-sdk "$RUNNER_TEMP/python-sdk"
          cd "$RUNNER_TEMP/python-sdk"
          git fetch --depth 1 origin "${{ env.ACP_PYTHON_SDK_SHA }}"
          git checkout "${{ env.ACP_PYTHON_SDK_SHA }}"
      - name: Run Favetto against the SDK echo agent
        run: |
          # echo_agent.py carries inline PEP 723 metadata; `uv run` honors it.
          # Expand $RUNNER_TEMP here in the shell — `env:` values are not
          # shell-expanded.
          export FAVETTO_INTEROP_AGENT="uv run $RUNNER_TEMP/python-sdk/examples/echo_agent.py"
          cargo nextest run --locked -p favetto --test acp_interop_e2e
