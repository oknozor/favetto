# Example hooks. Loaded by `favetto daemon --hooks hooks.toml`.
#
# WARNING: a hook whose action enqueues a task that itself emits the triggering
# event (e.g. `event = "TaskFinished"` running a task) will loop forever. Prefer a
# specific integration event as the trigger.

# When an issue-created event arrives (e.g. from a GitHub webhook), enqueue a task.
# [[hooks]]
# event = "IssueCreated"
# action = { type = "run_task", task = "che_repo_review" }

# Derive a new event from another.
# [[hooks]]
# event = "IssueCreated"
# action = { type = "emit_event", kind = "TaskCreated" }

# Example: notify via webhook whenever a task fails.
# [[hooks]]
# event = "TaskFailed"
# action = { type = "notify", channel = "webhook", config = { url = "http://localhost:9999/hook" } }
