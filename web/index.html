<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` lets the client paint under the Android/iOS safe
         areas; the CSS reclaims them with `env(safe-area-inset-*)`. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>{app_title}</title>
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
