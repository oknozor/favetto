[application]
name = "favetto"
out_dir = "dist"
asset_dir = "assets"

[web.app]
title = "favetto"

[web.watcher]
reload_html = true
watch_path = ["src", "assets"]

[bundle]
identifier = "dev.favetto.app"
publisher = "favetto"
icon = ["assets/icon.png"]

# Declare Android 13+ POST_NOTIFICATIONS. `dx` maps `notifications` to
# `android.permission.POST_NOTIFICATIONS` in the generated AndroidManifest.xml;
# the web Notification API inside the WebView drives the runtime request.
[permissions]
notifications = { description = "Tell you when a task needs your input" }
