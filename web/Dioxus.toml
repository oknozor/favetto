[application]
name = "favetto"
out_dir = "dist"
asset_dir = "assets"
# The custom entry point forces the soft keyboard to overlay the WebView
# instead of resizing it (`SOFT_INPUT_ADJUST_NOTHING`). `dx` copies it into the
# generated Gradle project in place of the default `MainActivity.kt`. The path
# is relative to this manifest (`web/`).
android_main_activity = "android/MainActivity.kt"

[web.app]
title = "favetto"

[web.watcher]
reload_html = true
watch_path = ["src", "assets"]

# `dx serve` runs the SPA on its own origin (default port 8080) and the web
# build calls the daemon with same-origin relative URLs (`/rpc`, `/events`,
# `/auth/login`, `/pair/exchange`). Forward those paths to the daemon so the
# dev server acts as its origin; without this, POST /auth/login and
# POST /pair/exchange hit the dev server and return HTTP 405. Dioxus proxies
# by path prefix and does not rewrite paths, so each daemon route needs its own
# entry. Change the host to match your daemon (127.0.0.1:7878 when it runs on
# the same machine).
[[web.proxy]]
backend = "http://192.168.1.50:7878/rpc"

[[web.proxy]]
backend = "http://192.168.1.50:7878/events"

[[web.proxy]]
backend = "http://192.168.1.50:7878/auth"

[[web.proxy]]
backend = "http://192.168.1.50:7878/pair"

[bundle]
identifier = "dev.favetto.app"
publisher = "favetto"
icon = ["assets/icon.png"]

# Android release signing. Uncomment and fill in to make
# `dx bundle --release --platform android` produce a signed *release* APK
# (Gradle `assembleRelease`: minified, native symbols stripped).
#
# `dx` 0.7.10 only runs `assembleRelease` when the build is `--release` AND this
# table is present; otherwise it silently runs `assembleDebug`, whose build type
# keeps the Rust debug symbols and yields a ~200 MB APK (see
# `build/android.rs` in dioxus-cli). `jks_file` is relative to this crate
# directory (`web/`); the keystore is git-ignored (`*.jks`). See
# docs/guide/web-client.md for how to create it.
#
# Keep this table commented. The CI Android job appends its own
# `[bundle.android]` (pointing at the ephemeral/secret keystore) to this file; an
# active table here would duplicate the key and make the manifest unparsable.
#
# [bundle.android]
# jks_file = "favetto-release.jks"
# jks_password = "..."
# key_alias = "favetto"
# key_password = "..."

# Declare Android 13+ POST_NOTIFICATIONS. `dx` maps `notifications` to
# `android.permission.POST_NOTIFICATIONS` in the generated AndroidManifest.xml.
# The runtime request and the notification posting are done from Rust through
# JNI (see `src/android_notify.rs`): the Android WebView does not implement the
# web Notification API.
[permissions]
notifications = { description = "Tell you when a task needs your input" }
