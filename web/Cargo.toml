[package]
name = "favetto-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oknozor/favetto"
description = "Dioxus (Rust to WASM/Android) client for the favetto daemon."

# Standalone workspace: `web/` is deliberately excluded from the root cargo
# workspace (see the root `Cargo.toml` `exclude` list) so the native
# `cargo clippy`/`nextest` gates are unaffected by the Dioxus toolchain.
[workspace]

[dependencies]
# The wasm-clean shared types. The client speaks the exact same MessagePack
# wire protocol as the TUI and MCP clients.
favetto-wire = { path = "../crates/favetto-wire" }
# Pinned to the version validated with `dx` 0.7.10; update `dx` in lockstep.
# `default-features = false` drops `devtools` and `logger`, which the client
# never uses and which bloat the WASM bundle; only the pieces it needs are
# opted back in (`launch` powers `dioxus::launch`, `lib` the runtime + `asset!`
# macro, `router` the SPA routes). See `docs/guide/web-client.md` for the
# measured gzipped size.
dioxus = { version = "=0.7.10", default-features = false, features = [
    "router",
    "launch",
    "lib",
] }
# CommonMark → HTML. WASM-safe; only the `html` feature (drops the
# getopts/bincode defaults used by the crate's CLI examples).
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# The subsequence matcher extracted from skim; pure Rust and WASM-safe, so the
# catalog's full-text search can rank results in the browser without a daemon
# round trip. (The `skim` TUI crate itself is not WASM-compatible.)
fuzzy-matcher = "0.3"
# MessagePack, matching `favetto-core::wire`'s `to_vec_named` framing.
rmp-serde = "1"
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
thiserror = "2"
# Browser storage, timers and the streaming-fetch reader for SSE.
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-streams = "0.4"
futures-util = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Storage",
    "UrlSearchParams",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "ReadableStream",
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
    "Document",
    # The feed's scroll container is read and driven directly (`Element`).
    "Element",
] }
dioxus-icons-phosphor = { version = "=0.2.1", default-features = false, features = ["regular"] }

# Host-side tests synthesize DOM events through the serialized form-event
# converter, which `dioxus` pulls in with `default-features = false`. Opting the
# feature back in here keeps the production dependency graph untouched.
[dev-dependencies]
dioxus-html = { version = "=0.7.10", features = ["serialize"] }

# Native targets (Android, plus the host test harness) have no browser `fetch`,
# so the transport goes through reqwest. rustls with bundled webpki roots keeps
# Android self-contained (no system OpenSSL); `stream` powers the SSE reader.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["time"] }
dirs = "7"

# On Android the persistent state lives in the app's private files directory,
# resolved through the JNI context the runtime installs.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
# Web (wasm32) is the default so a plain `dx build` produces the embedded SPA.
default = ["web"]
web = ["dioxus/web"]
# Android native. Cross-compiled only; a host build of this feature is not
# supported (it requires the Android SDK/NDK and an Android target triple).
mobile = ["dioxus/mobile"]

# Size-oriented release profile for the web bundle. `dx` derives the profile
# name from the platform + build mode (`wasm` + `release` → `wasm-release`,
# see `Platform::profile_name` in dioxus-cli), so defining it here overrides
# the ad-hoc `opt-level = "s"` profile `dx` would otherwise inject. Size
# guidance: <https://rustwasm.github.io/book/reference/code-size.html>.
#
# `opt-level = "z"` optimizes for size, fat LTO lets the whole crate graph
# inline/deduplicate across boundaries, `codegen-units = 1` gives the
# optimizer the full crate, and `panic = "abort"` drops the unwinding
# machinery. Keep `strip` unset: `dx` forces `strip = false` and strips debug
# info itself with `wasm-opt -Oz --strip-debug`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
