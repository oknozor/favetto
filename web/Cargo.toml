[package]
name = "favetto-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oknozor/favetto"
description = "Dioxus (Rust to WASM/Android) client for the favetto daemon."

# Standalone workspace: `web/` is deliberately excluded from the root cargo
# workspace (see the root `Cargo.toml` `exclude` list) so the native
# `cargo clippy`/`nextest` gates are unaffected by the Dioxus toolchain.
[workspace]

[dependencies]
# The wasm-clean shared types. The client speaks the exact same MessagePack
# wire protocol as the TUI and MCP clients.
favetto-wire = { path = "../crates/favetto-wire" }
# Pinned to the version validated with `dx` 0.7.10; update `dx` in lockstep.
dioxus = { version = "=0.7.10", features = ["router"] }
# CommonMark → HTML. WASM-safe; only the `html` feature (drops the
# getopts/bincode defaults used by the crate's CLI examples).
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# MessagePack, matching `favetto-core::wire`'s `to_vec_named` framing.
rmp-serde = "1"
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
thiserror = "2"
# Browser storage, timers and the streaming-fetch reader for SSE.
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-streams = "0.4"
futures-util = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Storage",
    "UrlSearchParams",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "ReadableStream",
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
    "Document",
    # The feed's scroll container is read and driven directly (`Element`).
    "Element",
] }

[features]
# Web (wasm32) is the default so a plain `dx build` produces the embedded SPA.
default = ["web"]
web = ["dioxus/web"]
# Android native. Cross-compiled only; a host build of this feature is not
# supported (it requires the Android SDK/NDK and an Android target triple).
mobile = ["dioxus/mobile"]
