[workspace]
resolver = "2"
members = [
    "crates/favetto-core",
    "crates/favetto-providers",
    "crates/favetto",
    "crates/favetto-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
