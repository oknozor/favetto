[workspace]
resolver = "2"
members = [
    "crates/favetto-wire",
    "crates/favetto-core",
    "crates/favetto-providers",
    "crates/favetto-tui",
    "crates/favetto-mcp",
    "crates/favetto",
]
# The Dioxus client is a standalone workspace with its own toolchain (`dx`);
# excluding it keeps the native clippy/nextest gates off the WASM/Android deps.
exclude = ["web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oknozor/favetto"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
