[workspace]
resolver = "2"
members = [
    "crates/favetto-core",
    "crates/favetto",
    "crates/mcp-filesystem",
    "crates/favetto-integrations",
    "crates/mcp-linear",
    "crates/mcp-github",
    "crates/mock-linear",
    "crates/mcp-gmail",
    "crates/mock-gmail",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
