[package]
name = "favetto-gpui"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false
description = "Native GPUI desktop client for the favetto daemon."

# Standalone cargo workspace: the GPUI client has its own GUI toolchain, and
# the pinned `gpui` version may churn independently — so the root workspace's
# `exclude` list keeps this out of the daemon's native clippy/nextest gates
# (see the root `Cargo.toml`).
[workspace]

[dependencies]
# Pinned to the version validated with docs/design/gpui-client.md step 01;
# `gpui` is published on crates.io (`gpui_platform` is not, per the plan).
gpui = "=0.2.2"
favetto-wire = { path = "../crates/favetto-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The desktop renderer only needs the event parser, not the HTML or CLI
# features.
pulldown-cmark = { version = "0.13", default-features = false }
rmp-serde = "1"
uuid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
async-channel = "2"
dirs = "7"
toml = "0.8"
# Patch the form's values into the loaded document so comments, unknown keys and
# ordering survive the round trip (`config.set` already writes with toml_edit).
toml_edit = "0.22"
base64 = "0.22"
fuzzy-matcher = "0.3"
# Grapheme-cluster boundaries for the shared text inputs (emoji, combining
# marks and IME composition must never be split mid-cluster).
unicode-segmentation = "1"
# Cron parsing/validation and next-occurrence math, shared with the daemon so
# the hint and the schedule it saves cannot disagree.
favetto-cron = { path = "../crates/favetto-cron" }

# Workaround for the first `cargo check`/`build` of the gpui graph:
# `gpui 0.2.2 -> gpui_http_client -> zed-async-tar -> xattr 0.2.3` uses
# `libc::ENOATTR`, which libc removed for Linux in 0.2.189. The pin is the
# smallest fix; keep it until gpui updates `xattr`.
[dependencies.libc]
version = "=0.2.188"

[dev-dependencies]
# `TestAppContext`/`VisualTestContext` (headless window rendering and resize)
# live behind this feature. Dev-only, so the shipped binary keeps the lean
# dependency graph.
gpui = { version = "=0.2.2", features = ["test-support"] }
