[package]
name = "favetto-gpui"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false
description = "Native GPUI desktop client for the favetto daemon."

# Standalone cargo workspace (same pattern as `web/`): the GPUI client has
# its own toolchain, and the pinned `gpui` version may churn independently —
# so the root workspace's `exclude` list keeps this out of the daemon's
# native clippy/nextest gates (see the root `Cargo.toml`).
[workspace]

[dependencies]
# Pinned to the version validated with docs/design/gpui-client.md step 01;
# `gpui` is published on crates.io (`gpui_platform` is not, per the plan).
gpui = "=0.2.2"
favetto-wire = { path = "../crates/favetto-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
uuid = { version = "1", features = ["serde"] }
chrono = "0.4"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
async-channel = "2"
dirs = "7"
toml = "0.8"
base64 = "0.22"
fuzzy-matcher = "0.3"
# Cron parsing/validation and next-occurrence math. Pinned to the daemon's own
# parser configuration so the hint and the schedule it saves cannot disagree.
croner = "3"

# Workaround for the first `cargo check`/`build` of the gpui graph:
# `gpui 0.2.2 -> gpui_http_client -> zed-async-tar -> xattr 0.2.3` uses
# `libc::ENOATTR`, which libc removed for Linux in 0.2.189. The pin is the
# smallest fix; keep it until gpui updates `xattr`.
[dependencies.libc]
version = "=0.2.188"

[dev-dependencies]
# `TestAppContext`/`VisualTestContext` (headless window rendering and resize)
# live behind this feature. Dev-only, so the shipped binary keeps the lean
# dependency graph.
gpui = { version = "=0.2.2", features = ["test-support"] }
