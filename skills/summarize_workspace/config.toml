[agent]
model = "mock"
max_iterations = 10

[[agent.steps]]
kind = "tool"
server = "filesystem"
tool = "list_dir"
args = { path = "." }

[[agent.steps]]
kind = "tool"
server = "filesystem"
tool = "read_file"
args = { path = "README.md" }

[[agent.steps]]
kind = "tool"
server = "filesystem"
tool = "write_file"
args = { path = "SUMMARY.md", content = "This workspace contains the `favetto` project.\n\nWritten by the mock agent runtime during M2 verification.\n" }

[[agent.steps]]
kind = "final"
text = "Workspace summarized and SUMMARY.md written."

[mcp.filesystem]
transport = "stdio"
command = "mcp-filesystem"
args = ["--root", "./workdir"]

[tools.allow]
filesystem = ["list_dir", "read_file", "write_file"]
