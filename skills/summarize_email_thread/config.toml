[agent]
model = "mock"
max_iterations = 10

[[agent.steps]]
kind = "tool"
server = "gmail"
tool = "list_messages"
args = { query = "in:inbox" }

[[agent.steps]]
kind = "tool"
server = "gmail"
tool = "get_message"
args = { id = "msg-1" }

[[agent.steps]]
kind = "final"
text = "Thread summarized: a weekly status update noting the favetto project is progressing well."

[mcp.gmail]
transport = "stdio"
command = "mcp-gmail"

[tools.allow]
gmail = ["list_messages", "get_message", "get_thread", "list_labels"]
