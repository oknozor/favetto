# favetto example configuration.
#
# Copy to ~/.config/favetto/config.toml (or point favetto at it with
# --config <path> / $FAVETTO_CONFIG). Every section is optional; favetto falls
# back to built-in defaults for anything you omit.

# The default external agent. `default` names an entry from [agents] below and is
# used for catalog tasks and new embedded-agent sessions unless the task names its
# own agent.
[agent]
default = "opencode"

# External coding agents. The daemon launches these in a PTY; the TUI embeds the
# live terminal in the Agent tab. `args` is the interactive invocation.
# `headless_args` runs catalog tasks unattended (no model); `run_args` is used
# instead when the task sets `model`, with `{prompt}`, `{provider}`, and `{model}`
# substituted so the model flag can sit where the CLI expects it.
# `resume_args` reopens a previously run session (`{session_id}`).
# `session_id_json_key` reads the agent's session id from a run's line-delimited
# JSON output. `prompt_args` seeds an interactive session (otherwise the prompt is
# written to stdin).
[agents.opencode]
command = "opencode"
args = []
prompt_args = ["--prompt", "{prompt}"]        # seed an interactive session
submit_prompt = true                          # press Enter so the prompt is sent
headless_args = ["run", "--auto", "{prompt}"] # --auto avoids approval prompts
run_args = ["run", "--model", "{provider}/{model}", "--auto", "--format", "json", "{prompt}"]
resume_args = ["--session", "{session_id}"]   # reopen a session in the TUI
session_id_json_key = "sessionID"             # from `run --format json` events

[agents.claude]
command = "claude"
args = []
prompt_args = ["{prompt}"]
headless_args = ["-p", "{prompt}"]
run_args = ["-p", "--model", "{model}", "{prompt}"]

[agents.pi]
command = "pi"
args = []

[agents.vibe]
command = "vibe"
args = []
prompt_args = ["{prompt}"]
submit_prompt = true
headless_args = ["-p", "{prompt}", "--auto-approve"]
run_args = ["-p", "--provider", "{provider}", "--model", "{model}", "{prompt}", "--auto-approve"]

# Daemon defaults. CLI flags take precedence over these.
[daemon]
listen = "127.0.0.1:7878"
socket = "/tmp/favetto.sock"
tasks_dir = "tasks"
# data_dir = "~/.local/share/favetto"

# Task executor concurrency + isolation.
[executor]
parallel = true            # run tasks concurrently (default false = one at a time)
max_concurrency = 4        # slots when parallel
worktree = true            # when parallel and in a git repo, give each task its own worktree
# worktree_dir = "~/.local/share/favetto/worktrees"  # absolute or repo-relative
keep_worktree = true       # keep worktrees after the task (so branches/changes can be inspected)
