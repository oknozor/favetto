# favetto example configuration.
#
# Copy to ~/.config/favetto/config.toml (or point favetto at it with
# --config <path> / $FAVETTO_CONFIG). Every section is optional; favetto falls
# back to built-in defaults for anything you omit.

# The default external agent. `default` names an entry from [agents] below and is
# used for catalog tasks and new embedded-agent sessions unless the task names its
# own agent.
[agent]
default = "opencode"

# External coding agents. The daemon launches these in a PTY; the TUI embeds the
# live terminal in the Agent tab.
#
# The four built-ins — opencode, claude, pi, vibe — are always registered, so an
# empty config still exposes them. A `[agents.<name>]` entry is only an overlay:
# it customizes a built-in's invocation, binds one to a custom name with
# `type = "opencode"` (etc.), or defines a custom CLI with `type = "configurable"`.
# Any field you set is merged over the built-in default; omitted fields keep it.
#
# `args` is the interactive invocation. `headless_args` runs catalog tasks
# unattended (no model); `run_args` is used instead when the task sets `model`,
# with `{prompt}`, `{provider}`, and `{model}` substituted so the model flag can
# sit where the CLI expects it. `resume_args` reopens a previously run session
# (`{session_id}`). `interactive_model_args` is the interactive invocation used
# when a model is selected (e.g. the one-shot wizard); it is a path that accepts a
# model, since some agents' main TUI does not. `session_id_json_key` reads the
# agent's session id from a run's line-delimited JSON output. `prompt_args` seeds
# an interactive session (otherwise the prompt is written to stdin).
#
# `type` selects the implementation explicitly: "opencode", "claude", "pi",
# "vibe", or "configurable". Omit it to use the built-in whose name matches the
# entry, or the template-only agent for a custom name. Add `[agents.<name>.git]`
# to override the global `[git]` section for that agent (same keys as `[git]`).
#
# Agent state (see docs/design/agent-state-adapters.md): `state` selects how the
# agent's live state is observed — "auto" (built-in default), "none" (screen
# fallback), "stdout", "server", or "hooks". `output_format` names a structured
# stdout format for headless runs ("opencode-json", "claude-stream-json",
# "pi-json", "pi-rpc", "vibe-streaming", or "plain-jsonl"). `server` selects the
# opencode server ("managed", "background", or a URL); `hooks = true` lets
# claude report through per-launch HTTP hooks. A custom `configurable` agent only
# has a parser for "plain-jsonl": top-level `text`/`content` becomes its summary
# text, `{"type":"tool_use"}` rows become tool calls, and every other JSON row is
# preserved verbatim.
#
# An agent whose binary is not on PATH is still listed and marked unavailable;
# launching it fails with a clear error. Availability is resolved once at daemon
# startup, so a PATH change needs a restart.
#
# The blocks below document the shipped built-in defaults, so they are commented
# out. Uncomment one to override it.
#
# [agents.opencode]
# command = "opencode"
# args = []
# prompt_args = ["--prompt", "{prompt}"]        # seed an interactive session
# submit_prompt = true                          # press Enter so the prompt is sent
# headless_args = ["run", "--auto", "{prompt}"] # --auto avoids approval prompts
# run_args = ["run", "--model", "{provider}/{model}", "--auto", "--format", "json", "{prompt}"]
# resume_args = ["--session", "{session_id}"]   # reopen a session in the TUI
# interactive_model_args = ["mini", "--model", "{provider}/{model}"]  # interactive + model
# session_id_json_key = "sessionID"             # from `run --format json` events
#
# [agents.claude]
# command = "claude"
# args = []
# prompt_args = ["{prompt}"]
# headless_args = ["-p", "--output-format", "stream-json", "--verbose", "--include-partial-messages", "{prompt}"]
# run_args = ["-p", "--model", "{model}", "--output-format", "stream-json", "--verbose", "--include-partial-messages", "{prompt}"]
# interactive_model_args = ["--model", "{model}"]
# session_id_json_key = "session_id"
#
# [agents.pi]
# command = "pi"
# args = []
# prompt_args = ["{prompt}"]                     # seed an interactive session
# headless_args = ["--mode", "rpc", "--session-id", "{session_id}"]  # unattended RPC
# run_args = ["--mode", "rpc", "--provider", "{provider}", "--model", "{model}", "--session-id", "{session_id}"]
# resume_args = ["--session", "{session_id}"]    # reopen the run in the TUI
# interactive_model_args = ["--provider", "{provider}", "--model", "{model}"]
#
# [agents.vibe]
# command = "vibe"
# args = []
# prompt_args = ["{prompt}"]
# submit_prompt = true
# headless_args = ["-p", "{prompt}", "--auto-approve"]
# run_args = ["-p", "--provider", "{provider}", "--model", "{model}", "{prompt}", "--auto-approve"]
# interactive_model_args = ["--provider", "{provider}", "--model", "{model}"]
#
# A custom CLI that emits line-delimited JSON opt into a structured summary with
# output_format = "plain-jsonl" and keeps its session id via `session_id_json_key`.
# [agents.mycli]
# type = "configurable"
# command = "mycli"
# headless_args = ["run", "{prompt}"]
# output_format = "plain-jsonl"
# session_id_json_key = "session_id"
# state = "stdout"

# Daemon defaults. CLI flags take precedence over these.
[daemon]
listen = "127.0.0.1:7878"
socket = "/tmp/favetto.sock"
tasks_dir = "tasks"
# data_dir = "~/.local/share/favetto"

# Bounded database growth. This is the one setting that deletes data: at daemon
# startup and every six hours, rows older than `days` are pruned and the database
# is optionally VACUUM'd. The newest `min_tasks` task rows always survive. Set
# days = 0 to keep everything forever.
[daemon.retention]
days = 30          # delete rows older than this many days (0 = keep forever)
min_tasks = 1000   # always keep the newest N task rows
vacuum = true      # reclaim disk space after a prune

# Task executor concurrency + isolation.
[executor]
parallel = true            # run tasks concurrently (default false = one at a time)
max_concurrency = 4        # slots when parallel
worktree = true            # when parallel and in a git repo, give each task its own worktree
# worktree_dir = "~/.local/share/favetto/worktrees"  # absolute, ~-expanded, or repo-relative
keep_worktree = false      # default false = remove the worktree when the task ends; true keeps it for inspection
# max_output_bytes = 262144  # stored task output cap; longer output is truncated head+tail
# detect_awaiting_input = true     # surface a blocked agent as `awaiting_input` + notify
# awaiting_input_quiet_ms = 8000   # PTY quiet time before the generic detector fires

# Worktree retention. At daemon start and every six hours, tracked worktrees
# whose task is finished are removed once older than `days`, orphaned ones are
# reclaimed, and `git worktree prune` drops stale entries. Active tasks are
# never touched; days = 0 keeps opt-in worktrees forever.
[executor.worktree_retention]
days = 30          # remove finished-task worktrees older than this many days (0 = keep forever)
min_worktrees = 0  # always keep the newest N finished worktrees

# Non-interactive git for agent sessions. favetto injects these into every agent
# PTY through git's environment config only, never touching your real config.
# Default `signing = "off"` forces commit.gpgsign=false so an agent commit can
# never block on pinentry/askpass. Opt into "ssh" (recommended) or "gpg" for
# signed agent commits; prefer a passphrase-less key or one held by ssh-agent.
# Requires git >= 2.31. Any agent may add `[agents.<name>.git]` with the same keys
# to override the global section, and a task header may set `sign = "off"|"ssh"|"gpg"`.
[git]
# signing = "off"                 # "off" (default) | "ssh" | "gpg"
# user_name = "favetto agent"
# user_email = "agent@favetto.local"
# signing_key = "~/.config/favetto/agent_signing.pub"   # required for ssh/gpg
# passphrase_env = "FAVETTO_GIT_SIGNING_PASSPHRASE"     # never store secrets here
# passphrase_command = ["secret-tool", "lookup", "service", "favetto-git-signing"]

# GitHub webhook triggers. GitHub POSTs signed events to /webhooks/github;
# each matching rule enqueues the named catalog task with a truncated summary of
# the event as its input (reachable in prompts as {{ input.repo }}, etc.).
# Rules and the secret are read at startup; restart the daemon after editing.
[webhook.github]
enabled = true
secret_env = "GITHUB_WEBHOOK_SECRET"   # preferred
# secret = "..."                        # literal alternative (discouraged)

# When an issue is opened in any oknozor repo, run the triage task.
[[webhook.github.rules]]
name = "triage-opened-issues"
event = "issues"
action = "opened"
task = "favetto/triage_issues"
filter = { repo = "oknozor/*" }

# When a bug-labelled PR is opened against main by the owner, plan it.
[[webhook.github.rules]]
name = "plan-bug-prs"
event = "pull_request"
action = "opened"
task = "favetto/plan_issue"
filter = { labels_contains = ["bug"], base_ref = "main", author = "oknozor" }

# Editor opened by `e` on a Catalog task. Unset -> $VISUAL, then $EDITOR, then vi.
# [tui]
# editor = "code --wait"

# Client-side TUI sound notifications. Ignored by the daemon; sounds play on the
# machine running `favetto tui`. Overridable with --sound/--no-sound/
# --sound-command / --test-sound and the FAVETTO_SOUND* env vars.
[tui.sound]
enabled = true                 # master switch (default true)
player = "auto"                # "auto" | "bell" | "command"
# command = "paplay {file}"    # player = "command"; {file} is the sound path
# sound_dir = "~/.config/favetto/sounds"
# min_interval_ms = 400        # coalesce bursts (failure wins)
# only_when_unfocused = false

# Cue -> sound. Values: a built-in name (success/failure/attention/started),
# a .wav path (relative to sound_dir), "bell", or "none".
[tui.sound.events]
task_finished = "success"      # ascending chime on task success
task_failed   = "failure"      # descending tone on task failure
task_started  = "none"
attention     = "none"         # agent.exit
awaiting_input = "attention"   # agent blocked on a permission/choice/pinentry prompt
