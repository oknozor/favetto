# favetto example configuration.
#
# Copy to ~/.config/favetto/config.toml (or point favetto at it with
# --config <path> / $FAVETTO_CONFIG). Every section is optional; favetto falls
# back to built-in defaults for anything you omit.

# The default external agent. `default` names an entry from [agents] below and is
# used for catalog tasks and new embedded-agent sessions unless the task names its
# own agent.
[agent]
default = "opencode"

# External agents. Every agent is an Agent Client Protocol (ACP) server: the
# daemon launches `command args` and speaks ACP over its stdin/stdout. Prompts,
# tool calls and permission requests are structured protocol messages, not
# terminal text, so there are no per-vendor adapters to configure.
#
# The four built-in names are launch presets, not implementations:
#   opencode -> `opencode acp`
#   claude   -> `npx -y @zed-industries/claude-agent-acp`
#   pi       -> `npx -y pi-acp`
#   vibe     -> `vibe-acp`
# An empty config exposes all four. A `[agents.<name>]` entry overlays the preset
# (or defines any other ACP server), so adding a compatible agent is
# configuration, not code:
#
# [agents.goose]
# command = "goose"
# args = ["acp"]
#
# `permission` is the default policy for the agent's sessions: "ask" (forward a
# request to a connected client, failing closed if none answers), "allow", or
# "deny". A catalog task can override it with its own `permission` header.
# `env` and `cwd` apply to the server process; `[agents.<name>.git]` overrides the
# global `[git]` section for that agent.
#
# The blocks below document the shipped presets; uncomment one to override it.
#
# [agents.opencode]
# command = "opencode"
# args = ["acp"]
# permission = "ask"
#
# [agents.claude]
# command = "npx"
# args = ["-y", "@zed-industries/claude-agent-acp"]
#
# [agents.pi]
# command = "npx"
# args = ["-y", "pi-acp"]
#
# [agents.vibe]
# command = "vibe-acp"
# args = []

# Daemon defaults. CLI flags take precedence over these.
[daemon]
listen = "127.0.0.1:7878"
socket = "/tmp/favetto.sock"
# tasks_dir = "~/.config/favetto/tasks"
# data_dir = "~/.local/share/favetto"

# Bounded database growth. This is the one setting that deletes data: at daemon
# startup and every six hours, rows older than `days` are pruned and the database
# is optionally VACUUM'd. The newest `min_tasks` task rows always survive. Pruning
# first clears old `output` blobs (keeping metadata); per-run token/cost usage is
# stored separately on task_runs, so it survives that pass and stays available to
# `usage.stats` until the task row itself is deleted. Set days = 0 to keep
# everything forever.
[daemon.retention]
days = 30          # delete rows older than this many days (0 = keep forever)
min_tasks = 1000   # always keep the newest N task rows
vacuum = true      # reclaim disk space after a prune

# Repo-local task catalogs. Each repository's `<repo>/.favetto/tasks/*.md` files
# are loaded alongside the global `tasks_dir`, namespaced as
# `repo:<name>/<path>` (the name defaults to the directory basename). One repo is
# the daemon-wide *active* repo, which scopes the default target of newly added
# catalog tasks; switch it from the TUI (Ctrl+P -> Switch repo). `known`/`active`
# seed the registry at startup; the registry is then persisted in SQLite, so TUI
# add/remove/activate changes survive config edits and restarts.
#
# `base_dir` additionally discovers repositories automatically: any child within
# `depth` levels carrying a `.favetto/` directory is registered as a `scanned`
# repo and deregistered when its directory disappears (no restart needed). Only
# scanned repos are reclaimed; `known`/`repos.add` entries are pinned.
[repos]
# active = "favetto"
# base_dir = "~/code"   # scan this directory for `.favetto/` repos
# depth = 1             # 1 = immediate children; 2 = also `org/repo` nesting
# known = [{ path = "~/code/favetto" }]
# known = [{ path = "/srv/web", name = "web" }]

# Web client (embedded SPA) served by the daemon. `dir` overrides the assets
# embedded in the binary with a directory on disk for development; leave it empty
# in normal operation. `heartbeat_secs` is the SSE keep-alive interval.
[web]
enabled = true        # serve the embedded web client (default true)
dir = ""              # empty = embedded assets; a path = serve from disk (dev)
heartbeat_secs = 15   # SSE keep-alive interval, in seconds

# Authentication: short-lived, single-use tickets for header-less clients
# (browser WebSocket/SSE auth), plus the username/password login policy.
# The ticket is minted over authenticated HTTP, then presented in a query string
# where an Authorization header cannot go. User accounts are managed with
# `favetto user add|passwd|list|remove` and stored (hashed) in SQLite.
[auth]
ticket_ttl_secs = 30     # ticket lifetime, in seconds
login_rate_limit = 5     # failed logins per (username, client) before lockout (0 = unlimited)
login_window_secs = 300  # window over which login failures accumulate
require_tls = false      # reject non-loopback logins that did not arrive over HTTPS

# Task executor concurrency + isolation.
[executor]
parallel = true            # run tasks concurrently (default false = one at a time)
max_concurrency = 4        # slots when parallel
worktree = true            # when parallel and in a git repo, give each task its own worktree
# worktree_dir = "~/.local/share/favetto/worktrees"  # absolute, ~-expanded, or repo-relative
keep_worktree = false      # default false = remove the worktree when the task ends; true keeps it for inspection
# max_output_bytes = 262144  # stored task output cap; longer output is truncated head+tail
# detect_awaiting_input = true     # surface a blocked agent as `awaiting_input` + notify
# awaiting_input_quiet_ms = 8000   # PTY quiet time before the generic detector fires
# stale_run = "fail"         # startup recovery for a task left running by a crash: "fail" | "retry"

# Worktree retention. At daemon start and every six hours, tracked worktrees
# whose task is finished are removed once older than `days`, orphaned ones are
# reclaimed, and `git worktree prune` drops stale entries. Active tasks are
# never touched; days = 0 keeps opt-in worktrees forever.
[executor.worktree_retention]
days = 30          # remove finished-task worktrees older than this many days (0 = keep forever)
min_worktrees = 0  # always keep the newest N finished worktrees

# Automatic retry for retryable failures. Off by default: `max_attempts = 1`
# runs a task exactly once. When enabled, a failed attempt whose failure kind is
# listed in `retry_on` is re-enqueued after the backoff and records a run under
# `attempt + 1`. Agent and invalid-input failures are not in the default
# `retry_on`, so genuine task failures are never retried on their own.
[executor.retry]
# max_attempts = 1           # total attempts per task, including the first (1 = never retry)
# backoff = "exponential"    # "fixed" | "exponential"
# initial_ms = 5000          # base delay before the second attempt
# max_ms = 300000            # cap on any single backoff delay
# retry_on = ["infrastructure", "timeout"]

# Non-interactive git for agent sessions. favetto injects these into every agent
# PTY through git's environment config only, never touching your real config.
# Default `signing = "off"` forces commit.gpgsign=false so an agent commit can
# never block on pinentry/askpass. Opt into "ssh" (recommended) or "gpg" for
# signed agent commits; prefer a passphrase-less key or one held by ssh-agent.
# Requires git >= 2.31. Any agent may add `[agents.<name>.git]` with the same keys
# to override the global section, and a task header may set `sign = "off"|"ssh"|"gpg"`.
[git]
# signing = "off"                 # "off" (default) | "ssh" | "gpg"
# user_name = "favetto agent"
# user_email = "agent@favetto.local"
# signing_key = "~/.config/favetto/agent_signing.pub"   # required for ssh/gpg
# passphrase_env = "FAVETTO_GIT_SIGNING_PASSPHRASE"     # never store secrets here
# passphrase_command = ["secret-tool", "lookup", "service", "favetto-git-signing"]

# GitHub webhook triggers. GitHub POSTs signed events to /webhooks/github;
# each matching rule enqueues the named catalog task with a truncated summary of
# the event as its input (reachable in prompts as {{ input.repo }}, etc.).
# Rules and the secret are read at startup; restart the daemon after editing.
[webhook.github]
enabled = true
secret_env = "GITHUB_WEBHOOK_SECRET"   # preferred
# secret = "..."                        # literal alternative (discouraged)

# When an issue is opened in any oknozor repo, run the triage task.
[[webhook.github.rules]]
name = "triage-opened-issues"
event = "issues"
action = "opened"
task = "favetto/triage_issues"
filter = { repo = "oknozor/*" }

# When a bug-labelled PR is opened against main by the owner, plan it.
[[webhook.github.rules]]
name = "plan-bug-prs"
event = "pull_request"
action = "opened"
task = "favetto/plan_issue"
filter = { labels_contains = ["bug"], base_ref = "main", author = "oknozor" }

# TUI theming. `theme` is a built-in ("opencode", "catppuccin") or a user theme
# loaded from `~/.config/favetto/themes/<name>.json` (or `.favetto/themes/`).
# `theme_mode` is "system" (derive from the terminal), "dark", or "light".
# Both are overridable with FAVETTO_THEME_NAME / FAVETTO_THEME. Press Ctrl+P ->
# "Change theme" to preview and pick one for the session.
#
# Editor opened by `e` on a Catalog task. Unset -> $VISUAL, then $EDITOR, then vi.
# [tui]
# editor = "code --wait"
# theme = "opencode"
# theme_mode = "system"          # "system" | "dark" | "light"
# show_header = true             # tab bar
# show_footer = true             # status line

# Client-side TUI sound notifications. Ignored by the daemon; sounds play on the
# machine running `favetto tui`. Overridable with --sound/--no-sound/
# --sound-command / --test-sound and the FAVETTO_SOUND* env vars.
[tui.sound]
enabled = true                 # master switch (default true)
player = "auto"                # "auto" | "bell" | "command"
# command = "paplay {file}"    # player = "command"; {file} is the sound path
# sound_dir = "~/.config/favetto/sounds"
# min_interval_ms = 400        # coalesce bursts (failure wins)
# only_when_unfocused = false

# Cue -> sound. Values: a built-in name (success/failure/attention/started),
# a .wav path (relative to sound_dir), "bell", or "none".
[tui.sound.events]
task_finished = "success"      # ascending chime on task success
task_failed   = "failure"      # descending tone on task failure
task_started  = "none"
attention     = "none"         # agent.exit
awaiting_input = "attention"   # agent blocked on a permission/choice/pinentry prompt
